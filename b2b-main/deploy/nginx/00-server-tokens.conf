# Drop into the host nginx http{} context (Ubuntu: /etc/nginx/conf.d/) so
# every vhost — including biz.legaldesk.com — stops advertising the exact
# nginx build and OS in the Server response header.
#
# Install on the VPS:
#   sudo cp 00-server-tokens.conf /etc/nginx/conf.d/00-server-tokens.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# After reload, responses should show `Server: nginx` (no version / Ubuntu).

server_tokens off;
