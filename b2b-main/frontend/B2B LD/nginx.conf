# server_tokens off hides the nginx version and OS (e.g. stops
# "Server: nginx/1.24.0 (Ubuntu)" — the header becomes just "nginx").
# Must live in the http{} or server{} context.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
